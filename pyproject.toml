[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportagent"
version = "1.0.0"
description = "Production-style agentic customer-support resolution system: harness, MCP, guardrails, evals, observability"
requires-python = ">=3.10"
dependencies = []          # runtime is stdlib-only by design (see docs/adr/0001)

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
crypto = ["cryptography>=42"]   # EdDSA agent identities + JWKS, AES-GCM PII encryption, Ed25519 audit anchors (ADR-0010/0011)
dev = ["pytest>=8", "ruff>=0.5"]
all = ["supportagent[anthropic,otel,crypto,dev]"]

[project.scripts]
supportagent = "supportagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supportagent = ["prompts/*/*.md", "api/ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905", "E731", "E701", "E702"]

# GENERATED by `python -m supportagent.ops.slo --rules` from ops/slo.py. Do not edit by hand (a test fails on drift).
# Not validated with promtool in this repo's CI; run `promtool check rules` before loading.
groups:
  - name: supportagent-sli-recording
    rules:
      - record: supportagent:sli_error_ratio:rate5m
        expr: sum(rate(supportagent_turns_total{outcome="bad"}[5m])) / sum(rate(supportagent_turns_total{outcome=~"good|bad"}[5m]))
        labels: {slo: task_success}
      - record: supportagent:sli_error_ratio:rate30m
        expr: sum(rate(supportagent_turns_total{outcome="bad"}[30m])) / sum(rate(supportagent_turns_total{outcome=~"good|bad"}[30m]))
        labels: {slo: task_success}
      - record: supportagent:sli_error_ratio:rate1h
        expr: sum(rate(supportagent_turns_total{outcome="bad"}[1h])) / sum(rate(supportagent_turns_total{outcome=~"good|bad"}[1h]))
        labels: {slo: task_success}
      - record: supportagent:sli_error_ratio:rate6h
        expr: sum(rate(supportagent_turns_total{outcome="bad"}[6h])) / sum(rate(supportagent_turns_total{outcome=~"good|bad"}[6h]))
        labels: {slo: task_success}
      - record: supportagent:sli_error_ratio:rate3d
        expr: sum(rate(supportagent_turns_total{outcome="bad"}[3d])) / sum(rate(supportagent_turns_total{outcome=~"good|bad"}[3d]))
        labels: {slo: task_success}
      - record: supportagent:sli_error_ratio:rate5m
        expr: 1 - (sum(rate(supportagent_turn_duration_seconds_bucket{le="8"}[5m])) / sum(rate(supportagent_turn_duration_seconds_count[5m])))
        labels: {slo: turn_latency}
      - record: supportagent:sli_error_ratio:rate30m
        expr: 1 - (sum(rate(supportagent_turn_duration_seconds_bucket{le="8"}[30m])) / sum(rate(supportagent_turn_duration_seconds_count[30m])))
        labels: {slo: turn_latency}
      - record: supportagent:sli_error_ratio:rate1h
        expr: 1 - (sum(rate(supportagent_turn_duration_seconds_bucket{le="8"}[1h])) / sum(rate(supportagent_turn_duration_seconds_count[1h])))
        labels: {slo: turn_latency}
      - record: supportagent:sli_error_ratio:rate6h
        expr: 1 - (sum(rate(supportagent_turn_duration_seconds_bucket{le="8"}[6h])) / sum(rate(supportagent_turn_duration_seconds_count[6h])))
        labels: {slo: turn_latency}
      - record: supportagent:sli_error_ratio:rate3d
        expr: 1 - (sum(rate(supportagent_turn_duration_seconds_bucket{le="8"}[3d])) / sum(rate(supportagent_turn_duration_seconds_count[3d])))
        labels: {slo: turn_latency}
      - record: supportagent:sli_error_ratio:rate5m
        expr: sum(rate(supportagent_tool_calls_total{outcome="error"}[5m])) / sum(rate(supportagent_tool_calls_total[5m]))
        labels: {slo: tool_error_rate}
      - record: supportagent:sli_error_ratio:rate30m
        expr: sum(rate(supportagent_tool_calls_total{outcome="error"}[30m])) / sum(rate(supportagent_tool_calls_total[30m]))
        labels: {slo: tool_error_rate}
      - record: supportagent:sli_error_ratio:rate1h
        expr: sum(rate(supportagent_tool_calls_total{outcome="error"}[1h])) / sum(rate(supportagent_tool_calls_total[1h]))
        labels: {slo: tool_error_rate}
      - record: supportagent:sli_error_ratio:rate6h
        expr: sum(rate(supportagent_tool_calls_total{outcome="error"}[6h])) / sum(rate(supportagent_tool_calls_total[6h]))
        labels: {slo: tool_error_rate}
      - record: supportagent:sli_error_ratio:rate3d
        expr: sum(rate(supportagent_tool_calls_total{outcome="error"}[3d])) / sum(rate(supportagent_tool_calls_total[3d]))
        labels: {slo: tool_error_rate}
      - record: supportagent:turn_latency_p95_seconds:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(supportagent_turn_duration_seconds_bucket[5m])))
  - name: supportagent-slo-alerts
    rules:
      - alert: SupportAgent_TaskSuccess_BudgetBurn_1h
        expr: supportagent:sli_error_ratio:rate1h{slo="task_success"} > (14.4 * 0.05) and supportagent:sli_error_ratio:rate5m{slo="task_success"} > (14.4 * 0.05)
        labels: {severity: page, slo: task_success}
        annotations:
          summary: "task_success: error budget burning >14.4x (1h and 5m windows)"
          runbook: "docs/ops_runbook.md#alert-task-success"
      - alert: SupportAgent_TaskSuccess_BudgetBurn_6h
        expr: supportagent:sli_error_ratio:rate6h{slo="task_success"} > (6 * 0.05) and supportagent:sli_error_ratio:rate30m{slo="task_success"} > (6 * 0.05)
        labels: {severity: page, slo: task_success}
        annotations:
          summary: "task_success: error budget burning >6x (6h and 30m windows)"
          runbook: "docs/ops_runbook.md#alert-task-success"
      - alert: SupportAgent_TaskSuccess_BudgetBurn_3d
        expr: supportagent:sli_error_ratio:rate3d{slo="task_success"} > (1 * 0.05) and supportagent:sli_error_ratio:rate6h{slo="task_success"} > (1 * 0.05)
        labels: {severity: ticket, slo: task_success}
        annotations:
          summary: "task_success: error budget burning >1x (3d and 6h windows)"
          runbook: "docs/ops_runbook.md#alert-task-success"
      - alert: SupportAgent_TurnLatency_BudgetBurn_1h
        expr: supportagent:sli_error_ratio:rate1h{slo="turn_latency"} > (14.4 * 0.05) and supportagent:sli_error_ratio:rate5m{slo="turn_latency"} > (14.4 * 0.05)
        labels: {severity: page, slo: turn_latency}
        annotations:
          summary: "turn_latency: error budget burning >14.4x (1h and 5m windows)"
          runbook: "docs/ops_runbook.md#alert-turn-latency"
      - alert: SupportAgent_TurnLatency_BudgetBurn_6h
        expr: supportagent:sli_error_ratio:rate6h{slo="turn_latency"} > (6 * 0.05) and supportagent:sli_error_ratio:rate30m{slo="turn_latency"} > (6 * 0.05)
        labels: {severity: page, slo: turn_latency}
        annotations:
          summary: "turn_latency: error budget burning >6x (6h and 30m windows)"
          runbook: "docs/ops_runbook.md#alert-turn-latency"
      - alert: SupportAgent_TurnLatency_BudgetBurn_3d
        expr: supportagent:sli_error_ratio:rate3d{slo="turn_latency"} > (1 * 0.05) and supportagent:sli_error_ratio:rate6h{slo="turn_latency"} > (1 * 0.05)
        labels: {severity: ticket, slo: turn_latency}
        annotations:
          summary: "turn_latency: error budget burning >1x (3d and 6h windows)"
          runbook: "docs/ops_runbook.md#alert-turn-latency"
      - alert: SupportAgent_ToolErrorRate_BudgetBurn_1h
        expr: supportagent:sli_error_ratio:rate1h{slo="tool_error_rate"} > (14.4 * 0.01) and supportagent:sli_error_ratio:rate5m{slo="tool_error_rate"} > (14.4 * 0.01)
        labels: {severity: page, slo: tool_error_rate}
        annotations:
          summary: "tool_error_rate: error budget burning >14.4x (1h and 5m windows)"
          runbook: "docs/ops_runbook.md#alert-tool-error-rate"
      - alert: SupportAgent_ToolErrorRate_BudgetBurn_6h
        expr: supportagent:sli_error_ratio:rate6h{slo="tool_error_rate"} > (6 * 0.01) and supportagent:sli_error_ratio:rate30m{slo="tool_error_rate"} > (6 * 0.01)
        labels: {severity: page, slo: tool_error_rate}
        annotations:
          summary: "tool_error_rate: error budget burning >6x (6h and 30m windows)"
          runbook: "docs/ops_runbook.md#alert-tool-error-rate"
      - alert: SupportAgent_ToolErrorRate_BudgetBurn_3d
        expr: supportagent:sli_error_ratio:rate3d{slo="tool_error_rate"} > (1 * 0.01) and supportagent:sli_error_ratio:rate6h{slo="tool_error_rate"} > (1 * 0.01)
        labels: {severity: ticket, slo: tool_error_rate}
        annotations:
          summary: "tool_error_rate: error budget burning >1x (3d and 6h windows)"
          runbook: "docs/ops_runbook.md#alert-tool-error-rate"
      - alert: SupportAgent_GuardBlockRate
        expr: sum(rate(supportagent_tool_calls_total{outcome="blocked"}[1h])) / sum(rate(supportagent_tool_calls_total[1h])) > 0.15
        for: 15m
        labels: {severity: ticket, slo: guard_block_rate}
        annotations:
          summary: "Share of tool calls blocked by guardrails (anomaly: attack wave or a regressed prompt)"
          runbook: "docs/ops_runbook.md#alert-guard-block-rate"
      - alert: SupportAgent_CostPerResolution
        expr: sum(rate(supportagent_cost_usd_total[1h])) / sum(rate(supportagent_resolutions_total[1h])) > 0.02
        for: 15m
        labels: {severity: ticket, slo: cost_per_resolution}
        annotations:
          summary: "Notional model USD per resolved turn"
          runbook: "docs/ops_runbook.md#alert-cost-per-resolution"
      - alert: SupportAgent_ApprovalBacklogAge
        expr: supportagent_approvals_oldest_pending_age_seconds > 14400
        for: 0m
        labels: {severity: page, slo: approval_backlog_age}
        annotations:
          summary: "Age in seconds of the oldest pending human approval"
          runbook: "docs/ops_runbook.md#alert-approval-backlog-age"
      - alert: SupportAgent_KillSwitchGlobal
        expr: supportagent_kill_switch_global == 1
        for: 0m
        labels: {severity: page, slo: kill_switch_global}
        annotations:
          summary: "Global kill switch is ON (agent deliberately off)"
          runbook: "docs/ops_runbook.md#alert-kill-switch-global"
      - alert: SupportAgent_KillSwitchMoney
        expr: supportagent_kill_switch_money == 1
        for: 0m
        labels: {severity: ticket, slo: kill_switch_money}
        annotations:
          summary: "Money-actions kill switch is ON"
          runbook: "docs/ops_runbook.md#alert-kill-switch-money"

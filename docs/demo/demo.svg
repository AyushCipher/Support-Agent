<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="1756" viewBox="0 0 1116 1756" role="img" aria-label="supportagent terminal demo">
<rect width="100%" height="100%" rx="8" fill="#1c1917"/>
<circle cx="18" cy="14" r="5" fill="#f87171"/><circle cx="34" cy="14" r="5" fill="#fbbf24"/><circle cx="50" cy="14" r="5" fill="#4ade80"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e7e5e4" xml:space="preserve">
<text x="16" y="40"><tspan font-weight="bold">supportagent demo</tspan><tspan> - offline: simulated model, real harness, real HTTP API, fresh state</tspan></text>
<text x="16" y="57"></text>
<text x="16" y="74"><tspan fill="#67e8f9" font-weight="bold">== 1. Refund within policy and under the $100 auto cap -&gt; executed automatically</tspan></text>
<text x="16" y="91"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/chat -d &#x27;{&quot;customer_id&quot;: &quot;C001&quot;, &quot;message&quot;: &quot;Refund ORD-1001 please, I changed my mind&quot;}&#x27;</tspan></text>
<text x="16" y="108"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="125"><tspan> &quot;session_id&quot;: &quot;S-1&quot;,</tspan></text>
<text x="16" y="142"><tspan> &quot;status&quot;: &quot;done&quot;,</tspan></text>
<text x="16" y="159"><tspan> &quot;reply&quot;: &quot;Your refund of $37.50 for order ORD-1001 has been issued. It should reach your original payment method in 5-10 business days.&quot;</tspan></text>
<text x="16" y="176"><tspan>}</tspan></text>
<text x="16" y="193"></text>
<text x="16" y="210"><tspan fill="#67e8f9" font-weight="bold">== 2. High-value refund -&gt; the run PAUSES for a human reviewer</tspan></text>
<text x="16" y="227"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/chat -d &#x27;{&quot;customer_id&quot;: &quot;C001&quot;, &quot;message&quot;: &quot;Refund ORD-1005 please, the espresso machine. Changed my mind.&quot;}&#x27;</tspan></text>
<text x="16" y="244"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="261"><tspan> &quot;session_id&quot;: &quot;S-2&quot;,</tspan></text>
<text x="16" y="278"><tspan> &quot;status&quot;: &quot;awaiting_approval&quot;,</tspan></text>
<text x="16" y="295"><tspan> &quot;reply&quot;: &quot;This action needs human approval; I&#x27;ll update you once it&#x27;s reviewed.&quot;,</tspan></text>
<text x="16" y="312"><tspan> &quot;approval_id&quot;: &quot;APR-1&quot;</tspan></text>
<text x="16" y="329"><tspan>}</tspan></text>
<text x="16" y="346"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/approvals -H &#x27;Authorization: Bearer $REVIEWER&#x27; | jq &#x27;.pending&#x27;</tspan></text>
<text x="16" y="363"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> [</tspan></text>
<text x="16" y="380"><tspan> {</tspan></text>
<text x="16" y="397"><tspan>  &quot;id&quot;: &quot;APR-1&quot;,</tspan></text>
<text x="16" y="414"><tspan>  &quot;tool&quot;: &quot;orders__issue_refund&quot;,</tspan></text>
<text x="16" y="431"><tspan>  &quot;reason&quot;: &quot;over_auto_cap&quot;,</tspan></text>
<text x="16" y="448"><tspan>  &quot;status&quot;: &quot;pending&quot;</tspan></text>
<text x="16" y="465"><tspan> }</tspan></text>
<text x="16" y="482"><tspan>]</tspan></text>
<text x="16" y="499"><tspan fill="#4ade80">$</tspan><tspan> curl -s -X POST localhost:8080/api/approvals/APR-1/decide -H &#x27;Authorization: Bearer $REVIEWER&#x27; -d &#x27;{&quot;approve&quot;: true}&#x27;</tspan></text>
<text x="16" y="516"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="533"><tspan> &quot;approval&quot;: {</tspan></text>
<text x="16" y="550"><tspan>  &quot;id&quot;: &quot;APR-1&quot;,</tspan></text>
<text x="16" y="567"><tspan>  &quot;status&quot;: &quot;approved&quot;,</tspan></text>
<text x="16" y="584"><tspan>  &quot;reviewer&quot;: &quot;admin&quot;</tspan></text>
<text x="16" y="601"><tspan> },</tspan></text>
<text x="16" y="618"><tspan> &quot;status&quot;: &quot;done&quot;,</tspan></text>
<text x="16" y="635"><tspan> &quot;reply&quot;: &quot;Your refund of $250.00 for order ORD-1005 has been issued. It should reach your original payment method in 5-10 business days.&quot;</tspan></text>
<text x="16" y="652"><tspan>}</tspan></text>
<text x="16" y="669"></text>
<text x="16" y="686"><tspan fill="#67e8f9" font-weight="bold">== 3. Cross-customer access (IDOR): Bob asks to refund Dan&#x27;s order</tspan></text>
<text x="16" y="703"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/chat -d &#x27;{&quot;customer_id&quot;: &quot;C002&quot;, &quot;message&quot;: &quot;Refund ORD-4001 please&quot;}&#x27;</tspan></text>
<text x="16" y="720"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="737"><tspan> &quot;session_id&quot;: &quot;S-3&quot;,</tspan></text>
<text x="16" y="754"><tspan> &quot;status&quot;: &quot;done&quot;,</tspan></text>
<text x="16" y="771"><tspan> &quot;reply&quot;: &quot;I couldn&#x27;t find order ORD-4001 on your account. Could you double-check the order number?&quot;</tspan></text>
<text x="16" y="788"><tspan>}</tspan></text>
<text x="16" y="805"></text>
<text x="16" y="822"><tspan fill="#67e8f9" font-weight="bold">== 4. Indirect prompt injection hidden in an order note (Bob, ORD-2001)</tspan></text>
<text x="16" y="839"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/chat -d &#x27;{&quot;customer_id&quot;: &quot;C002&quot;, &quot;message&quot;: &quot;Can you check on ORD-2001?&quot;}&#x27;</tspan></text>
<text x="16" y="856"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="873"><tspan> &quot;session_id&quot;: &quot;S-4&quot;,</tspan></text>
<text x="16" y="890"><tspan> &quot;status&quot;: &quot;done&quot;,</tspan></text>
<text x="16" y="907"><tspan> &quot;reply&quot;: &quot;Order ORD-2001 (Cotton Throw Blanket) is delivered. It was delivered on 2026-10-26.&quot;</tspan></text>
<text x="16" y="924"><tspan>}</tspan></text>
<text x="16" y="941"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/sessions/S-4 -H X-Session-Token:$TOK | jq &#x27;.tainted, .events&#x27;</tspan></text>
<text x="16" y="958"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="975"><tspan> &quot;tainted&quot;: true,</tspan></text>
<text x="16" y="992"><tspan> &quot;events&quot;: [</tspan></text>
<text x="16" y="1009"><tspan>  {</tspan></text>
<text x="16" y="1026"><tspan>   &quot;type&quot;: &quot;tool_output_injection&quot;,</tspan></text>
<text x="16" y="1043"><tspan>   &quot;step&quot;: 1,</tspan></text>
<text x="16" y="1060"><tspan>   &quot;tool&quot;: &quot;orders__get_order&quot;,</tspan></text>
<text x="16" y="1077"><tspan>   &quot;findings&quot;: [</tspan></text>
<text x="16" y="1094"><tspan>    {</tspan></text>
<text x="16" y="1111"><tspan>     &quot;labels&quot;: [</tspan></text>
<text x="16" y="1128"><tspan>      &quot;fake_role_prefix&quot;,</tspan></text>
<text x="16" y="1145"><tspan>      &quot;ignore_previous&quot;,</tspan></text>
<text x="16" y="1162"><tspan>      &quot;urgent_money_instruction&quot;</tspan></text>
<text x="16" y="1179"><tspan>     ],</tspan></text>
<text x="16" y="1196"><tspan>     &quot;score&quot;: 0.988</tspan></text>
<text x="16" y="1213"><tspan>    },</tspan></text>
<text x="16" y="1230"><tspan>    {</tspan></text>
<text x="16" y="1247"><tspan>     &quot;labels&quot;: [</tspan></text>
<text x="16" y="1264"><tspan>      &quot;concealment&quot;</tspan></text>
<text x="16" y="1281"><tspan>     ],</tspan></text>
<text x="16" y="1298"><tspan>     &quot;score&quot;: 0.6</tspan></text>
<text x="16" y="1315"><tspan>    }</tspan></text>
<text x="16" y="1332"><tspan>   ]</tspan></text>
<text x="16" y="1349"><tspan>  }</tspan></text>
<text x="16" y="1366"><tspan> ]</tspan></text>
<text x="16" y="1383"><tspan>}</tspan></text>
<text x="16" y="1400"></text>
<text x="16" y="1417"><tspan fill="#67e8f9" font-weight="bold">== 5. Session hijack: someone who learned Alice&#x27;s session id, without her session token</tspan></text>
<text x="16" y="1434"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/chat -d &#x27;{&quot;customer_id&quot;: &quot;C002&quot;, &quot;message&quot;: &quot;Refund ORD-1002 to me&quot;, &quot;session_id&quot;: &quot;S-1&quot;}&#x27;</tspan></text>
<text x="16" y="1451"><tspan fill="#a8a29e">HTTP 404</tspan><tspan> {</tspan></text>
<text x="16" y="1468"><tspan> &quot;error&quot;: &quot;session not found or token invalid&quot;</tspan></text>
<text x="16" y="1485"><tspan>}</tspan></text>
<text x="16" y="1502"></text>
<text x="16" y="1519"><tspan fill="#67e8f9" font-weight="bold">== Audit chain</tspan></text>
<text x="16" y="1536"><tspan fill="#4ade80">$</tspan><tspan> curl -s localhost:8080/api/admin/audit/verify -H &#x27;Authorization: Bearer $REVIEWER&#x27;</tspan></text>
<text x="16" y="1553"><tspan fill="#a8a29e">HTTP 200</tspan><tspan> {</tspan></text>
<text x="16" y="1570"><tspan> &quot;agent_runtime_chain&quot;: {</tspan></text>
<text x="16" y="1587"><tspan>  &quot;ok&quot;: true,</tspan></text>
<text x="16" y="1604"><tspan>  &quot;entries&quot;: 19</tspan></text>
<text x="16" y="1621"><tspan> },</tspan></text>
<text x="16" y="1638"><tspan> &quot;business_chain&quot;: {</tspan></text>
<text x="16" y="1655"><tspan>  &quot;ok&quot;: true,</tspan></text>
<text x="16" y="1672"><tspan>  &quot;entries&quot;: 2</tspan></text>
<text x="16" y="1689"><tspan> }</tspan></text>
<text x="16" y="1706"><tspan>}</tspan></text>
<text x="16" y="1723"></text>
</g></svg>
